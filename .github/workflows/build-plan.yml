# Rebuilds the Implementation Plan Excel file from GitHub issues.
# Runs every Wednesday night after the 9 PM board cutoff, and any time from
# Actions -> "Build Implementation Plan" -> Run workflow.
name: Build Implementation Plan

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 4"   # Thu 03:30 UTC = Wed 11:30 PM EDT / 10:30 PM EST

permissions:
  contents: write   # commit the rebuilt Excel file
  issues: read      # read the plan issues

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5
      - name: Build plan from issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AS_OF=$(TZ=America/New_York date +%F)
          STAMP=$(TZ=America/New_York date +%m-%d)
          python plan/plan_github.py --repo "${{ github.repository }}" build \
            --template plan/template.xlsx \
            --out "plan/BankUnited_Implementation_Plan_latest.xlsx" --as-of "$AS_OF"
          mkdir -p plan/archive
          cp plan/BankUnited_Implementation_Plan_latest.xlsx "plan/archive/BankUnited_Implementation_Plan_${STAMP}.xlsx"
      - name: Commit the rebuilt plan
        run: |
          git config user.name "plan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f plan/BankUnited_Implementation_Plan_latest.xlsx plan/archive/
          git diff --cached --quiet || git commit -m "Rebuild Implementation Plan from issues ($(TZ=America/New_York date +%m/%d))"
          git push
