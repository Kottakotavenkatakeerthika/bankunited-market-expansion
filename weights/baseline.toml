# Final-score weights: Market Attractiveness = pillars, each pillar = its metrics.
#
# Edit a number, then run:   python -m src.scoring.run      (or python -m src.market_attractiveness for the baseline only)
# For a scenario, copy this file (e.g. weights/size_heavy.toml), edit it, then run:
#                            python -m src.market_attractiveness --weights weights/size_heavy.toml
# A scenario's output shows each MSA's rank change against this baseline.
#
# Weights are relative: they're rescaled to 100% (pillars across the score, metrics within each pillar),
# so they don't have to add up. 0 leaves a pillar or metric out.
# Every metric a pillar builder (src/scoring/pillarN.py) defines can be weighted here; one not listed counts 0.
#
# Baseline = the weights on main as of final-score-gate-v0.2 (2026-11-04), with equal 25% pillars (methodology).
# Pillar 3's competition x growth metric (P3-08) is built but not weighted here; see
# weights/scenarios/pillar3_competition_growth.toml.
#
# Order: pillar and metric weights first, then gap filling, scoring options and the filters.

[pillars]
pillar1 = 25   # Commercial lending
pillar2 = 25   # Deposits and treasury
pillar3 = 25   # Competition and entry windows
pillar4 = 25   # Market quality and durability

[pillar1]  # Commercial lending (V2, equal weights adopted 2026-11-04; local-lender pair shares one)
local_ci_growth         = 10  # local-lender C&I growth, 2019-24
local_cre_growth        = 10  # local-lender CRE growth, 2019-24
allocated_loan_growth   = 20  # all banks' C&I + CRE allocated by non-HQ deposit share, growth
mm_establishments       = 20  # establishments with 20-249 employees (the size metric)
mm_growth               = 20  # growth in that count, 2018-23
cre_payroll_growth      = 20  # nonresidential CRE payroll growth, 2018-23

[pillar2]  # Deposits and treasury (V1)
deposits_per_capita       = 10   # non-HQ deposits per resident, 2024
deposit_growth            = 10   # non-HQ deposit growth, 2019-24
deposits_per_branch       = 10   # deposits per non-HQ branch
wage_bill                 = 10   # QCEW total wages, 2024 (the size metric)
wage_bill_growth          = 10   # wage bill growth, 2019-24
payroll_per_establishment = 10   # CBP payroll per establishment
income_per_capita         = 10   # BEA personal income per capita
income_growth             = 10   # personal income growth, 2019-24

[pillar3]  # Competition and entry windows
deposit_hhi             = 1   # P3-01 deposit concentration (lower is better)
top3_share              = 1   # P3-02 top-3 holding companies' share
competitors_per_billion = 1   # P3-03
branches_per_billion    = 1   # P3-04
leader_share_change     = 1   # P3-07 3-year change in leaders' share

[pillar4]  # Market quality and durability
gdp_growth              = 12.5
gdp_volatility          = 12.5
unemployment_level      = 12.5
unemployment_volatility = 12.5
industry_hhi            = 12.5   # blank for 95 MSAs (CBP suppression); set to 0 to score them complete
establishment_growth    = 12.5
population_growth       = 12.5
net_migration_rate      = 12.5

[fill]  # missing values for these metrics count as the 50th percentile
pillar1 = ["local_ci_growth", "local_cre_growth"]

[options]   # how metrics are scored. Scenario files without an [options] table use these.
industry_hhi_missing_sectors = "leave_out"  # "leave_out": a sector CBP suppresses for a metro (usually mining) is left
                                            # out of its industry HHI; "blank": no industry HHI if any sector is
                                            # suppressed, so the metro can't be complete (95 metros in 2023)

[universe]
min_population = 250000   # size floor (gate requirement): metros below this population are scored but not
                          # ranked. 0 = off.
                          # Scenario files without a [universe] table use this value.

[fit]   # Fit & Feasibility filters: metros outside them are scored but not ranked. 0 / false = off.
max_miles_to_bankunited = 0      # only metros within this many miles of a BankUnited market can rank
min_miles_to_bankunited = 0      # only metros at least this far from a BankUnited market can rank
exclude_current_markets = false  # true: BankUnited's own markets are scored but not ranked
min_industry_share      = 0      # only metros with at least this % of CBP jobs in the industries below can rank
# Scenario files inherit each [fit] setting they don't set themselves. A scenario's own [fit.industries]
# replaces this whole list (sectors it doesn't list count as false).

[fit.industries]   # true = counts toward industry_share. Former research priority in brackets (docs/industry_fit_research.md)
"23" = true    # Construction [High]
"31" = true    # Manufacturing, 31-33 [High]
"42" = true    # Wholesale trade [High]
"48" = true    # Transportation and warehousing, 48-49 [High]
"53" = true    # Real estate and rental and leasing [High]
"54" = true    # Professional, scientific, and technical services [High]
"52" = true    # Finance and insurance [Medium]
"62" = true    # Health care and social assistance [Medium]
"61" = true    # Educational services [Medium]
"44" = true    # Retail trade, 44-45 [Medium]
"22" = true    # Utilities [Medium]
"51" = false   # Information [Low]
"56" = false   # Administrative and support and waste management [Low]
"81" = false   # Other services [Low]
"72" = false   # Accommodation and food services [Low]
"11" = false   # Agriculture, forestry, fishing and hunting [Low]
"21" = false   # Mining, quarrying, and oil and gas extraction [Low]
"55" = false   # Management of companies and enterprises [Low]
"71" = false   # Arts, entertainment, and recreation [Exclude]
"99" = false   # Industries not classified [Exclude]
