# Scenario: leave out the competition pillar.
# Question: how much does Pillar 3 move the ranking while its scoring direction is unresolved?
# (It currently rates Philadelphia and Chicago among the least competitive markets.)
# Change: [pillars] pillar3 25 -> 0. The other three pillars become a third each.
# Everything else is the baseline (weights/baseline.toml as of 2026-10-29).
# Run:  python -m src.market_attractiveness --weights weights/scenarios/pillar3_off.toml

[pillars]
pillar1 = 25   # Commercial lending
pillar2 = 25   # Deposits and treasury
pillar3 = 0    # Competition and entry windows
pillar4 = 25   # Market quality and durability

[pillar1]  # Commercial lending (V2, equal weights adopted 2026-11-04; local-lender pair shares one)
local_ci_growth         = 10  # local-lender C&I growth, 2019-24
local_cre_growth        = 10  # local-lender CRE growth, 2019-24
allocated_loan_growth   = 20  # all banks' C&I + CRE allocated by non-HQ deposit share, growth
mm_establishments       = 20  # establishments with 20-249 employees (the size metric)
mm_growth               = 20  # growth in that count, 2018-23
cre_payroll_growth      = 20  # nonresidential CRE payroll growth, 2018-23

[pillar2]  # Deposits and treasury (V1)
deposits_per_capita       = 10   # non-HQ deposits per resident, 2024
deposit_growth            = 10   # non-HQ deposit growth, 2019-24
deposits_per_branch       = 10   # deposits per non-HQ branch
wage_bill                 = 10   # QCEW total wages, 2024 (the size metric)
wage_bill_growth          = 10   # wage bill growth, 2019-24
payroll_per_establishment = 10   # CBP payroll per establishment
income_per_capita         = 10   # BEA personal income per capita
income_growth             = 10   # personal income growth, 2019-24

[pillar3]  # Competition and entry windows
competition_growth      = 80  # P3-08 competition x growth (corners in config/settings.toml)
leader_share_change     = 20  # P3-07 3-year change in leaders' share
deposit_hhi             = 0   # P3-01 deposit concentration; now an input to competition_growth
top3_share              = 0   # P3-02 near-duplicate of HHI
competitors_per_billion = 0   # P3-03 mostly measures metro size
branches_per_billion    = 0   # P3-04 inverse of Pillar 2's deposits per branch

[pillar4]  # Market quality and durability
gdp_growth              = 12.5
gdp_volatility          = 12.5
unemployment_level      = 12.5
unemployment_volatility = 12.5
industry_hhi            = 12.5   # blank for 95 MSAs (CBP suppression); set to 0 to score them complete
establishment_growth    = 12.5
population_growth       = 12.5
net_migration_rate      = 12.5

[fill]  # missing values for these metrics count as the 50th percentile (same as the baseline)
pillar1 = ["local_ci_growth", "local_cre_growth"]
